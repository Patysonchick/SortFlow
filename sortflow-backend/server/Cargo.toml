[package]
name = "server"
version = "0.1.1"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
axum = "0.8.8"
serde_json = "1.0.148"
sea-orm = { version = "2.0.0-rc.27", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "debug-print",
] }
entity = { path = "../entity" }
migration = { path = "../migration" }
uuid = { version = "1.19.0", features = ["v7", "fast-rng"] }
dotenvy = "0.15.7"
thiserror = "2.0.17"
image = "0.25.9"
qrcode = "0.14.1"
