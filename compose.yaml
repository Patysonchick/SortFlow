services:
  db:
    image: postgres:18.1-alpine3.23
    container_name: sortflow_db
    restart: always
    environment:
      POSTGRES_USER: sortflow_admin # TODO! ИЗМЕНИТЬ В ПРОИЗВОДСТВЕННМ ВАРИАНТЕ
      POSTGRES_PASSWORD: sortflow_password # TODO! ИЗМЕНИТЬ В ПРОИЗВОДСТВЕННМ ВАРИАНТЕ
      POSTGRES_DB: sortflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: