[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
axum = "0.8.7"
tower-http = { version = "0.6.8", features = ["tracing", "fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sea-orm = { version = "2.0.0-rc.20", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "debug-print",
] }
entity = { path = "../entity" }
migration = { path = "../migration" }
uuid = { version = "1.19.0", features = ["v7", "fast-rng"] }
chrono = "0.4.42"
dotenvy = "0.15.7"
